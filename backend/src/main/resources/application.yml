spring:
  application:
    name: campus-equipment
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campus_equipment}
    username: ${DB_USERNAME:campus}
    password: ${DB_PASSWORD:campus}
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true
  # Email is optional (MAIL_PROVIDER=log by default), so an unreachable SMTP server must not mark the app as down.
  health.mail.enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  timezone: ${CAMPUS_TIMEZONE:UTC}
  seed-demo-data: ${SEED_DEMO_DATA:true}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  bootstrap-admin:
    email: ${ADMIN_EMAIL:admin@campus.edu}
    password: ${ADMIN_PASSWORD:Admin12345}
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-is-a-dev-only-secret-0123456789}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
    issuer: campus-equipment
  mail:
    provider: ${MAIL_PROVIDER:log}
    from: ${MAIL_FROM:equipment-desk@campus.edu}
  payments:
    provider: ${PAYMENT_PROVIDER:mock}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev-webhook-secret}
    currency: ${PAYMENT_CURRENCY:USD}
  jobs:
    enabled: ${JOBS_ENABLED:true}
    reminder-lead: PT24H
